name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ci
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich libmpich-dev

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=mpicc \
          -DCMAKE_CXX_COMPILER=mpicxx \
          -DERF_REMORA_ENABLE_TESTS=ON \
          -DERF_ENABLE_RRTMGP=OFF \
          -DERF_ENABLE_NETCDF=OFF

    - name: Build
      run: |
        cmake --build build --parallel

    - name: Compile Tests
      run: |
        ctest --test-dir build -L compile --output-on-failure --no-tests=error

    - name: Restart Tests
      run: |
        ctest --test-dir build -L restart --output-on-failure --no-tests=error

    - name: Parallel Tests
      run: |
        ctest --test-dir build -L parallel --output-on-failure --no-tests=error

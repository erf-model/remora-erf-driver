name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ci
  # ERF CI uses `cancel-in-progress: true`, but this driver build can be
  # expensive enough that canceling an in-flight run makes debugging harder.
  # cancel-in-progress: true
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    env:
      BUILD_NPROCS: 4

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    # The parallel suite writes a plotfile set per test and keeps every work
    # directory until ctest finishes. Without this the runner ran out of disk
    # mid-suite and was killed outright ("No space left on device"), which is
    # why those runs reported no logs at all. ERF takes the same step.
    - name: Free disk space on Ubuntu
      uses: ./.github/actions/free-space-ubuntu

    - name: Install MPI and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich libmpich-dev ccache

    # ERF and REMORA both use the single-step `actions/cache`, which declares
    # `post-if: success()` and so saves nothing when a job fails. That works for
    # them because their CI is green. Here it deadlocked: the job has never
    # succeeded, so the cache was never written, so every run paid a full cold
    # build (0/425 ccache hits), which made the job long enough to be fragile.
    # Restoring and saving as separate steps breaks the cycle -- the save runs
    # even when the tests fail, so the next run starts warm.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    # A GitHub-hosted runner has four cores, so 6 and 8 ranks oversubscribe it.
    # ERF caps its own sweep at 4 for the same reason. The full 2;4;6;8 sweep
    # moves to parallel-full-sweep.yml.
    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=mpicc \
          -DCMAKE_CXX_COMPILER=mpicxx \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_REMORA_ENABLE_TESTS=ON \
          -DREMORA_ENABLE_PNETCDF=OFF \
          -DERF_ENABLE_NETCDF=OFF \
          -DERF_ENABLE_RRTMGP=OFF \
          -DERF_REMORA_PARALLEL_TEST_NRANKS="2;4"

    - name: Build
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z
        cmake --build build --parallel $BUILD_NPROCS
        ccache -s

    # Saved even on failure, unlike the single-step action's post hook. Without
    # this the repo's cache inventory stays empty (it was 0 caches / 0 bytes,
    # against ERF's 26 / 10.5 GB) for as long as CI is red.
    - name: Save ccache
      if: always() && steps.ccache-restore.outputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    - name: Compile Tests
      run: |
        ctest --test-dir build -L compile --output-on-failure --no-tests=error

    - name: Restart Tests
      run: |
        ctest --test-dir build -L restart --output-on-failure --no-tests=error

    - name: Parallel Tests
      run: |
        ctest --test-dir build -L parallel --output-on-failure --no-tests=error

    # Headroom left at the end is the number that says whether the disk fix is
    # holding. A run that finishes with only tens of MB free is one test away
    # from the failure this replaced.
    - name: Report disk usage
      if: always()
      run: |
        df -h
        du -sh build 2>/dev/null || true
        du -sh build/mpi_* 2>/dev/null | sort -h | tail -10 || true

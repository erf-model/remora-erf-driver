# Vale configuration for the ERF-REMORA driver documentation and source comments.
#
# Prototype. Not wired into CI; run it by hand:
#
#   pip install vale                       # or use a system vale >= 3.20
#   vale sync --config Docs/vale/.vale.ini
#   vale --config Docs/vale/.vale.ini Docs/sphinx_doc/*.rst
#   python3 Docs/tools/vale-diff.py development --config Docs/vale
#
# Two format sections, because prose and source comments want different rules.
#
# Package versions are pinned by release URL where the registry does not pin
# them. A new rule appearing on its own is disruptive in a shared repository
# and in CI that fails on new alerts.
StylesPath = styles
MinAlertLevel = suggestion
Packages = Microsoft, https://github.com/ChrisChinchilla/Openly/releases/download/0.4.6/Openly.zip, alex, neighbor

# --- Prose -------------------------------------------------------------------
#
# Microsoft is the base guide. It was chosen on measured alert density across
# roughly 398k words of AMReX-family documentation, where it edged Google by
# about 2% -- the two implement their top four rules identically, so the choice
# is close to arbitrary and is recorded rather than argued.
#
# Openly sits at suggestion as an advisory layer. Its five disables below are
# measured, not guessed: each was confirmed by co-occurrence at an identical
# file and line with a rule from another package.
#
# A rule name that does not exist is silently ignored, so a config can read as
# configured and do nothing. Naming a rule also does not enable its package --
# the package must appear in BasedOnStyles.
[*.{rst,md}]
BasedOnStyles = Microsoft, Openly, alex, neighbor

# 165 of 165 Microsoft.Headings alerts co-occur with this. Same check.
Openly.Titles = NO
# 117 of 117 Microsoft.SentenceLength co-occur; Openly's is a stricter
# superset. The base guide wins, for consistency.
Openly.SentenceLength = NO
# 7 of 7 co-located with Microsoft.UIVerbs, and `neighbor` owns accessibility.
Openly.A11Y = NO
# 100% co-located, and one alert.
Openly.But = NO
# Not an overlap: the family already runs codespell, and this needs a domain
# dictionary it does not have. 671 alerts of near-pure noise.
Openly.Spelling = NO

# Not adopted: the Readability package fires seven metrics at the same position
# (FleschReadingEase, SMOG, FleschKincaid, GunningFog, LIX, ColemanLiau,
# AutomatedReadability). Openly's single metric is kept instead, so one
# sentence produces one signal.

# --- Source comments ---------------------------------------------------------
#
# Vale extracts C and C++ comments natively, so prose living in a comment is
# reachable. Doxygen markup passes through without generating alerts -- 424
# markers in one REMORA header produced none.
[*.{H,h,hpp,cpp,cc}]
BasedOnStyles = Placement
Microsoft.SentenceLength = warning
# Layout rules are meaningless inside comment blocks, which carry tables,
# symbols and code.
Microsoft.Quotes = NO
Microsoft.Spacing = NO
Microsoft.Percentages = NO

# Two exemptions, applied before any rule runs. BlockIgnores is
# syntax-specific, so it belongs in this section and not the global one.
#
# 1. Decorated heading blocks: rule line, one line of text, rule line. ERF uses
#    `// ****` and has 64 of them; REMORA uses `// ----`. Section headers, not
#    misplaced prose.
# 2. Comment runs carrying a \see reference: three lines are allowed when one
#    of them points at where the prose actually lives.
#
# Known limitation: BlockIgnores operates on the markup layer and Vale extracts
# C++ comments before that, so these have no effect on source files -- verified
# by A/B, identical counts with and without. The exemptions that do work are in
# styles/config/scripts/block3.tengo. These entries are kept because they are
# the correct declarations for any markup file that grows the same problem.
#
# Four or more lines is out either way, so a \see does not buy length.
BlockIgnores = (?ms)^[ \t]*//[ \t]*[-=*+_#]{4,}[^\n]*\n[ \t]*//[^\n]*\n[ \t]*//[ \t]*[-=*+_#]{4,}[^\n]*$
BlockIgnores = (?m)(?:^[ \t]*//[^\n]*\n){0,2}^[ \t]*//[^\n]*\\\\see[^\n]*\n(?:^[ \t]*//[^\n]*\n){0,2}
